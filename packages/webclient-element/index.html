<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;highorder-app&gt; shell demo</title>
    <style>
      /* Host page styles. Note they do NOT affect the element's internals. */
      body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; background: #f8fafc; }
      h1 { font-size: 16px; margin: 0 0 16px; color: #334155; }
      .bar { display: flex; gap: 8px; margin-bottom: 16px; }
      button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
      .box { padding: 24px; border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; }
      .log { margin-top: 16px; font: 12px ui-monospace, monospace; color: #64748b; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>&lt;highorder-app&gt; shell — two independent instances</h1>
    <div class="bar">
      <button id="theme">toggle theme</button>
      <button id="locale">toggle locale</button>
    </div>
    <div class="box"><highorder-app id="a" locale="en" theme="light"></highorder-app></div>
    <div class="box" style="margin-top: 16px">
      <highorder-app id="b" locale="zh" theme="dark" endpoint="http://localhost:8080"></highorder-app>
    </div>
    <div class="log" id="log"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
